name: Release

# A `v*` tag runs the security audit and CI gate, builds all platform binaries and
# Debian packages, generates checksums, and publishes the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual run'
        required: false
        default: '0.0.0-dryrun'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve version (and gate a tag)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            [ "$v" = "$cargo_v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_v"; exit 1; }
          else
            v="${INPUT_VERSION:-0.0.0-dryrun}"
            v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      # A tag publishes; run the CI gate on exactly the tagged commit first.
      - name: Install the Rust version pinned by Cargo.toml (rust-version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal -c rustfmt,clippy && rustup default "$v"
      - name: Gate (fmt, clippy, tests)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AGY_TEST_MODE: '1'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test -- --test-threads=16

  audit:
    name: Security Audit
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build Linux (${{ matrix.deb }})
    needs: [prepare, audit]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            asset: agy-pool-linux-amd64
            deb: amd64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            asset: agy-pool-linux-arm64
            deb: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install the Rust version pinned by Cargo.toml (rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal && rustup default "$v"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: |
          mkdir -p dist
          AGY_POOL_VERSION=${VERSION} cargo build --release --locked --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/agy-pool" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Verify binary and build Debian package
        run: |
          # x86_64 musl builds are static-pie; both forms have no dynamic loader.
          file "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}" | grep -Eq 'statically linked|static-pie linked'
          VERSION_OUT=$("dist/${{ matrix.asset }}" --version)
          echo "$VERSION_OUT"
          [ "$VERSION_OUT" = "agy-pool ${VERSION}" ]
          "dist/${{ matrix.asset }}" --help
          ./scripts/build-deb.sh "${{ matrix.deb }}" "${VERSION}" "dist/${{ matrix.asset }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.deb }}
          path: dist/

  sums:
    name: Checksums and Package Verification
    needs: [prepare, linux]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums and file list
        run: |
          cd dist
          sha256sum agy-pool-linux-amd64 agy-pool-linux-arm64 agy-pool_*_amd64.deb agy-pool_*_arm64.deb > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

          # Assert the release asset list (5 assets, same names `agy-pool update` looks up)
          COUNT=$(ls -1 | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "Expected exactly 5 assets in dist, found $COUNT"
            ls -la
            exit 1
          fi

          for F in \
            agy-pool-linux-amd64 \
            agy-pool-linux-arm64 \
            "agy-pool_${VERSION}_amd64.deb" \
            "agy-pool_${VERSION}_arm64.deb" \
            SHA256SUMS; do
            if [ ! -f "$F" ]; then
              echo "Missing expected asset: $F"
              exit 1
            fi
          done

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-dist
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: sums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: rust-release-dist
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/agy-pool-linux-amd64
            dist/agy-pool-linux-arm64
            dist/*.deb
            dist/SHA256SUMS
