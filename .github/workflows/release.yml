name: Release

# A `v*` tag publishes the binaries and Debian packages that CI (ci.yml) already built, tested and
# smoke-tested for exactly the tagged commit; nothing is rebuilt. Tag only after CI on that commit
# is green. workflow_dispatch assembles and verifies the assets for the selected ref without
# publishing (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish CI build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
      actions: read # find the CI run and download its artifacts
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$v"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Find the green CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # push and workflow_dispatch runs build exactly this commit; pull_request runs build a merge commit.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no successful CI run (push or workflow_dispatch) for $GITHUB_SHA; wait for CI on this commit to pass, then re-run this workflow"
            exit 1
          fi
          echo "Using CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the CI build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify assets and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          # Artifacts drop the executable bit.
          chmod +x agy-pool-linux-amd64 agy-pool-linux-arm64
          VERSION_OUT=$(./agy-pool-linux-amd64 --version)
          [ "$VERSION_OUT" = "agy-pool ${VERSION}" ] || { echo "::error::binary reports '$VERSION_OUT', expected agy-pool ${VERSION}"; exit 1; }
          sha256sum agy-pool-linux-amd64 agy-pool-linux-arm64 "agy-pool_${VERSION}_amd64.deb" "agy-pool_${VERSION}_arm64.deb" > SHA256SUMS
          cat SHA256SUMS
          # Exactly the 5 assets `agy-pool update` looks up.
          COUNT=$(ls -1 | wc -l)
          [ "$COUNT" -eq 5 ] || { ls -la; echo "::error::expected exactly 5 assets, found $COUNT"; exit 1; }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/agy-pool-linux-amd64
            dist/agy-pool-linux-arm64
            dist/*.deb
            dist/SHA256SUMS
