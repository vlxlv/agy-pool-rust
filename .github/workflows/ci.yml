name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

# A newer push to the same branch or PR cancels the older run. On main every commit gets its
# own group, because a shared group would still drop a queued run when the next one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Smoke Test & Code Hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      AGY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version pinned by Cargo.toml (rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal -c rustfmt,clippy && rustup default "$v"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Fail if live state paths exist before tests
        run: for p in ~/.local/share/agy-pool ~/.config/agy-pool ~/.gemini; do test ! -e "$p" || { echo "unexpected $p"; exit 1; }; done
      - run: cargo test -- --test-threads=16
      - name: Fail if tests wrote to live state paths
        run: for p in ~/.local/share/agy-pool ~/.config/agy-pool ~/.gemini; do test ! -e "$p" || { echo "tests wrote to $p"; find "$p" | head; exit 1; }; done

  audit:
    name: Security Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Scheduled runs also fire on forks with Actions enabled; don't file issues there.
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Package (${{ matrix.deb }})
    needs: [test, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            asset: agy-pool-linux-amd64
            deb: amd64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            asset: agy-pool-linux-arm64
            deb: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install the Rust version pinned by Cargo.toml (rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal && rustup default "$v"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          mkdir -p dist
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          AGY_POOL_VERSION=${VERSION} cargo build --release --locked --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/agy-pool" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Verify binary linkage and CLI
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          file "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}" | grep -Eq 'statically linked|static-pie linked'
          VERSION_OUT=$("dist/${{ matrix.asset }}" --version)
          echo "$VERSION_OUT"
          [ "$VERSION_OUT" = "agy-pool ${VERSION}" ]
          "dist/${{ matrix.asset }}" --help

      - name: Build and test Debian package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          ./scripts/build-deb.sh "${{ matrix.deb }}" "${VERSION}" "dist/${{ matrix.asset }}" dist
          DEB_FILE="dist/agy-pool_${VERSION}_${{ matrix.deb }}.deb"
          test -f "$DEB_FILE"
          sudo dpkg -i "$DEB_FILE"
          /usr/bin/agy-pool --version
          sudo dpkg -r agy-pool

      - name: Runtime daemon smoke test
        run: |
          tmp_dir=$(mktemp -d)
          mkdir -p "$tmp_dir/data" "$tmp_dir/config"
          cat << 'EOF' > "$tmp_dir/config/config.json"
          {
            "version": 1,
            "server": {
              "listen": "127.0.0.1",
              "port": 18899
            }
          }
          EOF
          AGY_DATA_DIR="$tmp_dir/data" AGY_CONFIG_FILE="$tmp_dir/config/config.json" AGY_POOL_DAEMON_CHILD=1 "dist/${{ matrix.asset }}" &
          DAEMON_PID=$!
          sleep 1
          RESP=$(curl -s --fail --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:18899/healthz)
          echo "Healthcheck response: $RESP"
          echo "$RESP" | grep -q '"status":"ok"'
          kill -TERM $DAEMON_PID 2>/dev/null || true
          rm -rf "$tmp_dir"

  # Shared-state races in tests only show up under some schedules; repeat the suite at several
  # thread counts on scheduled weekly runs and manual triggers.
  stress:
    name: Concurrency Stress (${{ matrix.threads }} threads)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        threads: [4, 16, 64]
    env:
      AGY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version pinned by Cargo.toml (rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          rustup toolchain install "$v" --profile minimal && rustup default "$v"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-run
      - name: Run the suite 5 times
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i (threads=${{ matrix.threads }})"
            cargo test -- --test-threads=${{ matrix.threads }} || { echo "::error::run $i failed"; exit 1; }
            echo "::endgroup::"
          done
      - name: Fail if tests wrote to live state paths
        run: for p in ~/.local/share/agy-pool ~/.config/agy-pool ~/.gemini; do test ! -e "$p" || { echo "tests wrote to $p"; find "$p" | head; exit 1; }; done
