name: Security Audit

# RustSec advisories for the locked dependencies: weekly, and whenever Cargo.lock changes.
# On schedule, audit-check opens an issue per advisory.
on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths: ['Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.lock', '.github/workflows/audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Scheduled runs also fire on forks with Actions enabled; don't file issues there.
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
