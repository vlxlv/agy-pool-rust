[package]
name = "agy-pool"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"

[lib]
name = "agy_pool"
path = "src/lib.rs"

[[bin]]
name = "agy-pool"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
hex = "0.4.3"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "signal", "process"] }
hyper = { version = "1.12.0", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio", "server-auto"] }
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["native-tokio", "http1", "ring", "tls12", "logging"] }
# time: jiff (Phase 2 decision, used everywhere)
jiff = "0.2.39"
url = "2.5.8"
base64 = "0.23.1"
bytes = "1.12.1"
pbkdf2 = "0.13.0"
hmac = "0.13.0"
getrandom = "0.4.3"

tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-native-certs = "0.8.5"
tower-service = "0.3.3"
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
rcgen = "0.14.10"

[profile.release]
strip = true
lto = "thin"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
